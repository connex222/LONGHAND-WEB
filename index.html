    calc((100dvh - 128px - 3*var(--key-h) - 6*var(--rgap) - 2*var(--pad-y))/7),
    62px);
  --key-h:clamp(44px,7.9dvh,60px);
}
html[data-theme=light]{
  /* Paper — a warm rag stock, cooler than cream so it reads as stationery */
  --ground:#EBE9E3; --ground-2:#F6F4F0; --surface:#FFFFFF; --surface-2:#F2F0EB;
  --edge:#DCD8CF; --edge-strong:#A6A198; --rule:#DEDAD1;

  --exact-a:#2A649E; --exact-b:#1A4877; --exact-ink:#FFFFFF;
  --present-a:#CE9026; --present-b:#A46A0E; --present-ink:#FFFFFF;
  --absent-a:#C4C0B7; --absent-b:#B8B4AA; --absent-ink:#5D5952;
  --key-rest:#FFFFFF; --key-dead:#D8D4CB; --key-dead-ink:#8A867E;

  --ink:#181720; --ink-dim:#585463; --ink-faint:#8B8796;
  --focus:#1F5490;
  --hl:rgba(255,255,255,.55);
  --sink:rgba(0,0,0,.12);
  --cast:0 1px 2px rgba(24,23,32,.14);
  --lift:0 24px 60px rgba(24,23,32,.2),0 2px 8px rgba(24,23,32,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  /* a faint overhead vignette gives the page a top light and some depth */
  background:var(--ground);
  background-image:radial-gradient(128% 74% at 50% -8%,var(--ground-2),transparent 62%);
  color:var(--ink);font-family:var(--f-ui);font-optical-sizing:auto;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.app{
  width:100%;max-width:552px;height:100%;display:flex;flex-direction:column;
  transition:opacity .44s ease,transform .44s cubic-bezier(.3,0,.2,1);
}
.app.pre{opacity:0;transform:translateY(10px)}
.app.in{opacity:1;transform:none}

/* ---------------------------------------------------------------- title */
.title{
  position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:32px 26px calc(34px + env(safe-area-inset-bottom));
  background:var(--ground);
  background-image:radial-gradient(122% 68% at 50% 4%,var(--ground-2),transparent 64%);
  transition:opacity .44s ease,transform .5s cubic-bezier(.4,0,.2,1);
}
.title.gone{opacity:0;transform:scale(1.05);pointer-events:none}
.mark{display:flex;gap:8px;margin-bottom:30px}
.mark i{
  width:clamp(34px,10vw,42px);height:clamp(34px,10vw,42px);border-radius:9px;
  border:1px solid var(--edge-strong);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  box-shadow:inset 0 1px 0 var(--hl);
  animation:lay .5s cubic-bezier(.2,.9,.3,1) backwards;
}
.mark i:nth-child(1){animation-delay:.06s}
.mark i:nth-child(2){animation-delay:.16s}
.mark i:nth-child(3){animation-delay:.26s}
.mark i.e{background:linear-gradient(180deg,var(--exact-a),var(--exact-b));border-color:var(--exact-b);box-shadow:inset 0 1px 0 var(--hl),var(--cast)}
.mark i.p{background:linear-gradient(180deg,var(--present-a),var(--present-b));border-color:var(--present-b);box-shadow:inset 0 1px 0 var(--hl),var(--cast)}
@keyframes lay{from{opacity:0;transform:translateY(-9px) rotateX(48deg)}to{opacity:1;transform:none}}
.t-word{font-family:var(--f-display);font-weight:500;font-size:clamp(44px,13.5vw,62px);letter-spacing:-.022em;margin:0;line-height:1}
.t-tag{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin:14px 0 0;font-weight:500}
.t-no{font-size:12.5px;color:var(--ink-faint);margin:9px 0 0;font-variant-numeric:tabular-nums}
.t-actions{width:100%;max-width:268px;margin-top:34px}
.t-actions .btn{margin-top:10px}
.t-foot{font-size:11.5px;color:var(--ink-faint);margin:26px 0 0;letter-spacing:.02em}

/* ---------------------------------------------------------------- header */
header{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:11px 12px 12px;flex:0 0 auto;position:relative;
}
header::after{
  content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--rule) 14%,var(--rule) 86%,transparent);
}
.brand{text-align:center;line-height:1}
.wordmark{
  font-family:var(--f-display);font-weight:500;font-size:clamp(25px,6.6vw,33px);
  letter-spacing:-.012em;margin:0;
}
.meta{
  display:flex;gap:8px;justify-content:center;align-items:baseline;margin-top:5px;
  font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:500;font-variant-numeric:tabular-nums;
}
#modepill{color:var(--present-a)}
#modepill:not(:empty)::before{content:"\00b7";margin-right:8px;color:var(--ink-faint)}
.tools{display:flex;gap:1px}
.tools.right{justify-content:flex-end}
.icon{
  background:none;border:0;color:var(--ink-faint);width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;cursor:pointer;font:inherit;transition:color .14s,background .14s;
}
.icon:hover{background:var(--surface);color:var(--ink)}
.icon.label{
  width:auto;height:31px;border:1px solid var(--rule);border-radius:999px;
  padding:0 clamp(8px,3vw,12px);
  font-family:var(--f-ui);font-size:clamp(8.5px,2.5vw,9.5px);font-weight:600;
  letter-spacing:clamp(.05em,.45vw,.13em);
  text-transform:uppercase;color:var(--ink-dim);white-space:nowrap;
}
.icon.label:hover{background:none;border-color:var(--edge-strong);color:var(--ink)}
.icon.label .narrow{display:none}
@media (max-width:349px){.icon.label .wide{display:none}.icon.label .narrow{display:inline}}
.icon:focus-visible,.key:focus-visible,.btn:focus-visible,.seg button:focus-visible,.sw:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------------------------------------------------------------- board */
.board-wrap{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0;padding:clamp(4px,2dvh,20px) 0 clamp(10px,5dvh,54px)}
.board{
  display:flex;flex-direction:column;gap:var(--rgap);
  padding:var(--pad-y) var(--pad-x);border-radius:16px;border:1px solid var(--rule);
  background:linear-gradient(180deg,rgba(255,255,255,.024),rgba(255,255,255,.006));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 34px 64px -34px rgba(0,0,0,.85);
}
html[data-theme=light] .board{background:linear-gradient(180deg,#FBFAF7,#F4F2ED);box-shadow:inset 0 1px 0 #fff,0 24px 50px -30px rgba(24,23,32,.3)}
.row{display:grid;grid-template-columns:repeat(7,var(--tile));gap:var(--cgap);position:relative}
/* One ruled line, not seven. It marks the line you are writing on — the motif
   earns its place by carrying information rather than decorating every row. */
.row.active::after{
  content:"";position:absolute;left:1px;right:1px;bottom:calc(var(--rgap)*-.5 - 1px);height:1.5px;
  background:linear-gradient(90deg,transparent,var(--edge-strong) 10%,var(--edge-strong) 90%,transparent);
  opacity:.55;
}
.tile{
  width:var(--tile);height:var(--tile);
  border:1px solid var(--edge);border-radius:7px;
  background:none;
  display:grid;place-items:center;
  font-family:var(--f-tile);font-weight:600;font-size:calc(var(--tile)*.5);
  line-height:1;text-transform:uppercase;color:var(--ink);
  transition:border-color .14s,background .14s,box-shadow .14s;
}
.tile.filled{
  border-color:var(--edge-strong);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  box-shadow:inset 0 1px 0 var(--hl);
  animation:press .13s cubic-bezier(.2,.8,.3,1);
}
.tile.cursor{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus),0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.tile.exact,.tile.present{box-shadow:inset 0 1px 0 var(--hl),var(--cast)}
.tile.absent{box-shadow:inset 0 1px 1px var(--sink)}
.tile.exact{background:linear-gradient(180deg,var(--exact-a),var(--exact-b));border-color:var(--exact-b);color:var(--exact-ink)}
.tile.present{background:linear-gradient(180deg,var(--present-a),var(--present-b));border-color:var(--present-b);color:var(--present-ink)}
.tile.absent{background:linear-gradient(180deg,var(--absent-a),var(--absent-b));border-color:var(--absent-a);color:var(--absent-ink)}
.tile.flip{animation:flip .3s cubic-bezier(.45,0,.55,1)}
@keyframes press{0%{transform:scale(.93)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
@keyframes flip{0%{transform:rotateX(0) scale(1)}48%{transform:rotateX(-88deg) scale(.965)}100%{transform:rotateX(0) scale(1)}}
.row.shake{animation:shake .3s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{12%,88%{transform:translateX(-2px)}25%,75%{transform:translateX(3px)}38%,62%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.row.won .tile{animation:settle .62s cubic-bezier(.22,.9,.26,1)}
@keyframes settle{
  0%{transform:translateY(0)}
  26%{transform:translateY(-15%);box-shadow:inset 0 1px 0 var(--hl),0 12px 22px rgba(0,0,0,.4)}
  62%{transform:translateY(2%)}100%{transform:translateY(0)}
}
/* the signature: one roller passing over the row, flipping tiles in its wake */
.row.roll::before{
  content:"";position:absolute;top:-4px;bottom:-4px;width:30%;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--focus) 26%,transparent),rgba(255,255,255,.09),transparent);
  animation:roll .76s cubic-bezier(.38,0,.5,1);pointer-events:none;z-index:2;border-radius:10px;filter:blur(.4px);
}
@keyframes roll{from{transform:translateX(-44%)}to{transform:translateX(304%)}}

/* -------------------------------------------- toast: reserved, never shifts */
.toastslot{flex:0 0 auto;height:36px;display:grid;place-items:center;padding:0 12px}
.toast{
  background:var(--surface);color:var(--ink);border:1px solid var(--edge);
  padding:6px 15px;border-radius:999px;font-size:13px;font-weight:500;letter-spacing:.005em;
  box-shadow:var(--cast);opacity:0;transform:translateY(-4px) scale(.97);
  transition:opacity .16s ease,transform .16s cubic-bezier(.2,.9,.3,1);
  max-width:100%;text-align:center;
}
.toast.show{opacity:1;transform:none}

/* ---------------------------------------------------------------- keyboard */
.kb{flex:0 0 auto;padding:0 6px 9px;display:flex;flex-direction:column;gap:6px}
.kbrow{display:flex;gap:5px;justify-content:center}
.key{
  flex:1 1 0;min-width:0;height:var(--key-h);border:1px solid var(--edge);border-radius:8px;
  background:linear-gradient(180deg,var(--key-rest),color-mix(in srgb,var(--key-rest) 86%,#000));
  box-shadow:inset 0 1px 0 var(--hl),var(--cast);
  color:var(--ink);font-family:var(--f-ui);
  font-size:clamp(12.5px,3.6vw,15px);font-weight:600;text-transform:uppercase;letter-spacing:.01em;
  cursor:pointer;position:relative;display:grid;place-items:center;
  transition:background .12s,color .12s,border-color .12s,box-shadow .1s,transform .06s;
}
.key.wide{flex:1.6 1 0;color:var(--ink-dim)}
.key:active{transform:translateY(1px);box-shadow:inset 0 2px 4px var(--sink)}
.key.exact{background:linear-gradient(180deg,var(--exact-a),var(--exact-b));border-color:var(--exact-b);color:var(--exact-ink)}
.key.present{background:linear-gradient(180deg,var(--present-a),var(--present-b));border-color:var(--present-b);color:var(--present-ink)}
.key.absent{background:var(--key-dead);border-color:transparent;color:var(--key-dead-ink);box-shadow:inset 0 1px 3px var(--sink)}
/* spent: every occurrence of this letter has been located */
.key.spent{background:linear-gradient(180deg,var(--exact-a),var(--exact-b));border-color:var(--exact-b);color:var(--exact-ink);opacity:.44}
.key.spent::after{content:"";position:absolute;left:24%;right:24%;top:50%;height:1.5px;background:currentColor;border-radius:1px}
.key svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------------------------------------------------------------- sheets */
.scrim{position:fixed;inset:0;background:rgba(6,6,10,.66);display:none;z-index:40;
  align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px) saturate(.9)}
.scrim.open{display:flex;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet:focus{outline:none}
.sheet{
  background:var(--surface);border:1px solid var(--edge);border-radius:18px;box-shadow:var(--lift);
  width:100%;max-width:428px;max-height:88dvh;overflow-y:auto;padding:26px 26px 28px;
  -webkit-user-select:text;user-select:text;animation:rise-in .24s cubic-bezier(.2,.9,.28,1);
}
@keyframes rise-in{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheet h2{font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:-.015em;margin:0 0 4px;line-height:1.1}
.sheet .sub{color:var(--ink-faint);font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:500;margin:0 0 20px}
.sheet h3{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:24px 0 10px;font-weight:600}
.sheet p{font-size:14.5px;line-height:1.6;color:var(--ink-dim);margin:0 0 11px}
.sheet p strong{color:var(--ink);font-weight:600}
.close{position:sticky;top:0;float:right;margin:-8px -10px 0 0}
.ex{display:flex;gap:5px;margin:10px 0 6px}
.ex .tile{width:33px;height:33px;font-size:17px;border-radius:5px}
.btn{
  width:100%;padding:14px;border:1px solid var(--exact-b);border-radius:11px;
  background:linear-gradient(180deg,var(--exact-a),var(--exact-b));color:var(--exact-ink);
  box-shadow:inset 0 1px 0 var(--hl),var(--cast);
  font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.005em;cursor:pointer;margin-top:16px;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .06s,filter .14s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--ink-dim);border-color:var(--edge);box-shadow:none;margin-top:9px}
.btn.ghost:hover{color:var(--ink);border-color:var(--edge-strong);filter:none}
.stats{display:flex;gap:7px;margin:6px 0 8px}
.stat{flex:1;text-align:center;background:var(--surface-2);border:1px solid var(--edge);border-radius:11px;padding:12px 4px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.bars{display:flex;flex-direction:column;gap:5px;margin-top:8px}

  text-decoration:none;background:linear-gradient(180deg,var(--absent-a),var(--absent-b));color:var(--absent-ink);
  min-width:26px;padding:3px 8px;border-radius:4px;text-align:right;font-weight:600;
}

.opt div{font-size:14.5px;font-weight:500}
.opt small{display:block;color:var(--ink-faint);font-size:12.5px;font-weight:400;margin-top:3px;line-height:1.45}
.sw{flex:0 0 auto;width:46px;height:27px;border-radius:999px;background:var(--absent-a);border:1px solid var(--edge);cursor:pointer;position:relative;transition:background .18s,border-color .18s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:var(--cast);transition:transform .18s cubic-bezier(.3,.9,.3,1)}
.sw[aria-checked=true]{background:linear-gradient(180deg,var(--exact-a),var(--exact-b));border-color:var(--exact-b)}
.sw[aria-checked=true]::after{transform:translateX(19px)}

.seg button{flex:1;border:1px solid transparent;background:none;color:var(--ink-faint);font:inherit;font-size:13px;font-weight:600;padding:8px;border-radius:8px;cursor:pointer;transition:all .14s}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);border-color:var(--edge);box-shadow:var(--cast)}
.answerline{font-family:var(--f-display);font-weight:500;font-size:34px;letter-spacing:.01em;text-align:center;margin:16px 0 6px;text-transform:uppercase;color:var(--ink)}
.minigrid{display:flex;flex-direction:column;gap:4px;align-items:center;margin:20px 0 6px}
.mini{display:grid;grid-template-columns:repeat(7,15px);gap:4px}
.mini i{height:15px;border-radius:3px;background:linear-gradient(180deg,var(--absent-a),var(--absent-b));box-shadow:inset 0 1px 0 var(--hl)}
.mini i.exact{background:linear-gradient(180deg,var(--exact-a),var(--exact-b))}
.mini i.present{background:linear-gradient(180deg,var(--present-a),var(--present-b))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#testpanel{position:fixed;inset:0;background:var(--ground);z-index:99;overflow:auto;padding:22px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.7;-webkit-user-select:text;user-select:text}
#testpanel .p{color:#4ec9a0}#testpanel .f{color:#f04b4b;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const LEN = 7;
const EPOCH = Date.UTC(2026, 7, 12);          // 12 August 2026 = No. 1
const KEYS = ["qwertyuiop", "asdfghjkl", "zxcvbnm"];

/* ==================================================== storage adapter ===== */
/* localStorage where available, in-memory where it is not (artifact previews) */
const store = (() => {
  let live = false;
  try { localStorage.setItem("_lh", "1"); localStorage.removeItem("_lh"); live = true; } catch (e) {}
  const mem = new Map();
  return {
    live,
    get(k, d) {
      try { const v = live ? localStorage.getItem(k) : mem.get(k); return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      try { live ? localStorage.setItem(k, s) : mem.set(k, s); } catch (e) { mem.set(k, s); }
    }
  };
})();

/* ======================================================= pure game logic == */
export const EXACT = 2, PRESENT = 1, ABSENT = 0;

/** Two-pass marking. Exact matches claim their letter first, then a
 *  decrementing multiset assigns Present left to right. */
export function mark(guess, answer) {
  const res = new Array(LEN).fill(ABSENT);
  const pool = new Map();
  for (let i = 0; i < LEN; i++) {
    if (guess[i] === answer[i]) res[i] = EXACT;
    else pool.set(answer[i], (pool.get(answer[i]) || 0) + 1);
  }
  for (let i = 0; i < LEN; i++) {
    if (res[i] === EXACT) continue;
    const n = pool.get(guess[i]) || 0;
    if (n > 0) { res[i] = PRESENT; pool.set(guess[i], n - 1); }
  }
  return res;
}

/** What the player can legitimately deduce from the marks so far. */
export function knowledge(guesses, answer) {
  const fixed = new Array(LEN).fill(null);   // position -> known letter
  const minCount = new Map();                // letter -> at least this many
  const exhausted = new Map();               // letter -> exactly this many (count is closed)
  for (const g of guesses) {
    const m = mark(g, answer);
    const seen = new Map(), surplus = new Set();
    for (let i = 0; i < LEN; i++) {
      const ch = g[i];
      if (m[i] === EXACT) { fixed[i] = ch; seen.set(ch, (seen.get(ch) || 0) + 1); }
      else if (m[i] === PRESENT) seen.set(ch, (seen.get(ch) || 0) + 1);
      else surplus.add(ch);
    }
    for (const [ch, n] of seen) if (n > (minCount.get(ch) || 0)) minCount.set(ch, n);
    // a letter marked Absent alongside hits closes its count exactly
    for (const ch of surplus) exhausted.set(ch, seen.get(ch) || 0);
  }
  return { fixed, minCount, exhausted };
}

/** Hard mode: reuse everything already revealed. Returns null if legal. */
export function hardModeError(guess, guesses, answer) {
  const { fixed, minCount } = knowledge(guesses, answer);
  for (let i = 0; i < LEN; i++) {
    if (fixed[i] && guess[i] !== fixed[i])
      return `Position ${i + 1} must be ${fixed[i].toUpperCase()}`;
  }
  const have = new Map();
  for (const ch of guess) have.set(ch, (have.get(ch) || 0) + 1);
  for (const [ch, n] of minCount) {
    if ((have.get(ch) || 0) < n)
      return n > 1 ? `Guess needs ${n} \u00d7 ${ch.toUpperCase()}` : `Guess must use ${ch.toUpperCase()}`;
  }
  return null;
}

export function puzzleNumber(d = new Date()) {
  const local = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.floor((local - EPOCH) / 86400000) + 1;
}
export function answerFor(n) { return ANSWERS[((n - 1) % ANSWERS.length + ANSWERS.length) % ANSWERS.length]; }

/* =========================================================== app state === */
const S = {
  mode: "daily",
  answer: "", no: 0, rows: 6, hard: false,
  guesses: [], cur: "", cursor: 0, done: false, won: false, busy: false
};
const settings = store.get("lh.settings", { theme: "dark", assist: false, hard: false, spent: true });
let stats = store.get("lh.stats", { played: 0, won: 0, streak: 0, max: 0, dist: [0, 0, 0, 0, 0, 0, 0] });
let seen = new Set(store.get("lh.seen", []));

function rowCount() { return settings.hard ? 5 : settings.assist ? 7 : 6; }

/* ============================================================== render === */
const board = document.getElementById("board");
const kb = document.getElementById("kb");
const toastEl = document.getElementById("toast");
const live = document.getElementById("live");
const NAMES = ["absent", "present", "exact"];
const WORDS = ["not in the word", "in the word, wrong place", "correct"];

function buildBoard() {
  board.innerHTML = "";
  for (let r = 0; r < S.rows; r++) {
    const row = document.createElement("div");
    row.className = "row"; row.setAttribute("role", "row"); row.dataset.r = r;
    for (let c = 0; c < LEN; c++) {
      const t = document.createElement("div");
      t.className = "tile"; t.setAttribute("role", "gridcell");
      t.setAttribute("aria-label", `Row ${r + 1} letter ${c + 1}, empty`);
      row.appendChild(t);
    }
    board.appendChild(row);
  }
}

function buildKeyboard() {
  kb.innerHTML = "";
  KEYS.forEach((line, i) => {
    const row = document.createElement("div");
    row.className = "kbrow";
    if (i === 2) row.appendChild(keyBtn("enter", "wide",
      `<svg viewBox="0 0 24 24"><path d="M20 6v6a3 3 0 0 1-3 3H4"/><path d="M8 11l-4 4 4 4"/></svg>`, "Submit guess"));
    for (const ch of line) row.appendChild(keyBtn(ch, "", ch, `Letter ${ch.toUpperCase()}`));
    if (i === 2) row.appendChild(keyBtn("back", "wide",
      `<svg viewBox="0 0 24 24"><path d="M21 5H9L2 12l7 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>`, "Delete letter"));
    kb.appendChild(row);
  });
}
function keyBtn(k, cls, html, label) {
  const b = document.createElement("button");
  b.className = "key " + cls; b.dataset.k = k; b.innerHTML = html;
  b.setAttribute("aria-label", label); b.type = "button";
  b.addEventListener("click", () => press(k));
  return b;
}

function paintRow(r, letters, marks, animate) {
  const row = board.children[r];
  if (!row) return;
  [...row.children].forEach((t, c) => {
    const ch = letters[c] || "";
    t.textContent = ch;
    t.className = "tile" + (ch ? " filled" : "");
    if (!marks) {
      t.setAttribute("aria-label", ch
        ? `Row ${r + 1} letter ${c + 1}, ${ch.toUpperCase()}`
        : `Row ${r + 1} letter ${c + 1}, empty`);
      return;
    }
    const apply = () => {
      t.className = "tile filled " + NAMES[marks[c]];
      t.setAttribute("aria-label", `Row ${r + 1} letter ${c + 1}, ${ch.toUpperCase()}, ${WORDS[marks[c]]}`);
    };
    if (animate) {
      t.style.animationDelay = (c * 82) + "ms";
      t.classList.add("flip");
      setTimeout(apply, c * 82 + 128);
      setTimeout(() => { t.classList.remove("flip"); t.style.animationDelay = ""; }, c * 82 + 320);
    } else apply();
  });
  if (animate) { row.classList.add("roll"); setTimeout(() => row.classList.remove("roll"), 800); }
}

function paintCursor() {
  [...board.children].forEach(r => r.classList.remove("active"));
  const row = board.children[S.guesses.length];
  if (!row || S.done) return;
  row.classList.add("active");
  [...row.children].forEach((t, c) => t.classList.toggle("cursor", c === S.cursor && !S.busy));
}

function paintKeyboard() {
  const rank = { absent: 1, present: 2, spent: 3, exact: 4 };
  const state = {};
  const { fixed, minCount, exhausted } = knowledge(S.guesses, S.answer);
  for (const g of S.guesses) {
    const m = mark(g, S.answer);
    for (let i = 0; i < LEN; i++) {
      const s = NAMES[m[i]];
      const ch = g[i];
      if (!state[ch] || rank[s] > rank[state[ch]]) state[ch] = s;
    }
  }
  // exhausted: count is closed and every occurrence is placed
  if (settings.spent) {
    for (const [ch, n] of exhausted) {
      if (n === 0) continue;                    // n === 0 means simply absent; already grey
      const placed = fixed.filter(f => f === ch).length;
      if (placed >= n) state[ch] = "spent";     // count closed and every one located
    }
  }
  kb.querySelectorAll(".key").forEach(b => {
    const k = b.dataset.k;
    b.classList.remove("exact", "present", "absent", "spent");
    if (state[k]) b.classList.add(state[k]);
  });
}

let toastTimer;
function toast(msg, ms = 1500) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  live.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
}
function shake() {
  const row = board.children[S.guesses.length];
  if (!row) return;
  row.classList.add("shake");
  setTimeout(() => row.classList.remove("shake"), 260);
}

/* =============================================================== input === */
function press(k) {
  if (S.busy) return;
  if (k === "enter") return submit();
  if (k === "back") {
    if (S.done) return;
    if (S.cursor > 0 && S.cur[S.cursor - 1]) {
      S.cur = S.cur.slice(0, S.cursor - 1) + " " + S.cur.slice(S.cursor);
      S.cursor--;
    } else if (S.cur[S.cursor]) {
      S.cur = S.cur.slice(0, S.cursor) + " " + S.cur.slice(S.cursor + 1);
    }
    S.cur = S.cur.replace(/\s+$/, "");
    return redrawCurrent();
  }
  if (S.done || !/^[a-z]$/.test(k)) return;
  const arr = S.cur.padEnd(LEN, " ").split("");
  if (S.cursor >= LEN) return;
  arr[S.cursor] = k;
  S.cur = arr.join("").replace(/\s+$/, "");
  S.cursor = Math.min(nextEmpty(arr, S.cursor + 1), LEN);
  redrawCurrent();
}
function nextEmpty(arr, from) {
  for (let i = from; i < LEN; i++) if (arr[i] === " ") return i;
  return LEN;
}
function redrawCurrent() {
  paintRow(S.guesses.length, S.cur.padEnd(LEN, " ").split("").map(c => c === " " ? "" : c), null, false);
  paintCursor();
  save();
}

function submit() {
  if (S.done || S.busy) return;
  const g = S.cur.replace(/\s/g, "");
  if (g.length < LEN) { shake(); return toast("Needs seven letters"); }
  if (!VALID.has(g)) { shake(); return toast("Not in the word list"); }
  if (settings.hard) {
    const err = hardModeError(g, S.guesses, S.answer);
    if (err) { shake(); return toast(err, 2200); }
  }
  const m = mark(g, S.answer);
  const r = S.guesses.length;
  S.guesses.push(g); S.cur = ""; S.cursor = 0; S.busy = true;
  paintRow(r, g.split(""), m, true);
  live.textContent = `Row ${r + 1}: ` +
    g.split("").map((ch, i) => `${ch.toUpperCase()} ${WORDS[m[i]]}`).join(", ");
  setTimeout(() => {
    S.busy = false;
    paintKeyboard();
    const won = g === S.answer;
    if (won || S.guesses.length >= S.rows) finish(won, r);
    else { paintCursor(); save(); }
  }, 7 * 82 + 290);
}

function finish(won, r) {
  S.done = true; S.won = won;
  if (won) board.children[r].classList.add("won");
  if (S.mode === "daily") {
    stats.played++;
    if (won) { stats.won++; stats.streak++; stats.max = Math.max(stats.max, stats.streak); stats.dist[r]++; }
    else stats.streak = 0;
    store.set("lh.stats", stats);
  } else { seen.add(S.answer); store.set("lh.seen", [...seen]); }
  save();
  setTimeout(() => openSheet(resultSheet()), won ? 900 : 500);
}

document.addEventListener("keydown", e => {
  if (document.getElementById("scrim").classList.contains("open")) {
    if (e.key === "Escape") closeSheet();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (titleUp) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enterGame(); } return; }
  if (e.key === "Enter") { e.preventDefault(); press("enter"); }
  else if (e.key === "Backspace") { e.preventDefault(); press("back"); }
  else if (e.key === "ArrowLeft") { S.cursor = Math.max(0, S.cursor - 1); paintCursor(); }
  else if (e.key === "ArrowRight") { S.cursor = Math.min(LEN - 1, S.cursor + 1); paintCursor(); }
  else if (/^[a-zA-Z]$/.test(e.key)) press(e.key.toLowerCase());
});
board.addEventListener("click", e => {
  const t = e.target.closest(".tile"); if (!t || S.done) return;
  const row = t.parentElement;
  if (+row.dataset.r !== S.guesses.length) return;
  S.cursor = [...row.children].indexOf(t); paintCursor();
});

/* ============================================================ persistence */
function key() { return S.mode === "daily" ? "lh.daily" : "lh.practice"; }
function save() {
  store.set(key(), { no: S.no, answer: S.answer, rows: S.rows, hard: S.hard,
    guesses: S.guesses, cur: S.cur, done: S.done, won: S.won });
}

let titleUp = true, pendingResult = false;
const titleEl = document.getElementById("title");

function paintTitle() {
  document.getElementById("t-no").textContent = `No. ${S.no}  \u00b7  ` +
    new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("t-play").textContent =
    S.done ? "See today\u2019s result" : S.guesses.length ? "Continue" : "Play";
}

function enterGame() {
  if (!titleUp) return;
  titleUp = false;
  titleEl.classList.add("gone");
  const app = document.querySelector(".app");
  app.classList.remove("pre"); app.classList.add("in");
  setTimeout(() => { titleEl.style.display = "none"; }, 520);
  setTimeout(() => {
    paintCursor();
    if (!store.get("lh.seenhelp", false)) { store.set("lh.seenhelp", true); openSheet(helpSheet()); }
    else if (pendingResult) { pendingResult = false; openSheet(resultSheet()); }
  }, 470);
}

function startDaily() {
  S.mode = "daily";
  S.no = puzzleNumber();
  const saved = store.get("lh.daily", null);
  S.answer = answerFor(S.no);
  if (saved && saved.no === S.no) {
    S.rows = saved.rows; S.hard = saved.hard; S.guesses = saved.guesses;
    S.cur = saved.cur || ""; S.done = saved.done; S.won = saved.won;
  } else {
    S.rows = rowCount(); S.hard = settings.hard;
    S.guesses = []; S.cur = ""; S.done = false; S.won = false;
  }
  S.cursor = Math.min(S.cur.replace(/\s+$/, "").length, LEN);
  mount();
  if (titleUp) paintTitle();
  else if (S.done) setTimeout(() => openSheet(resultSheet()), 260);
  if (S.done && titleUp) pendingResult = true;
}

function startPractice(fresh) {
  S.mode = "practice";
  const saved = store.get("lh.practice", null);
  if (!fresh && saved && !saved.done) {
    S.answer = saved.answer; S.rows = saved.rows; S.hard = saved.hard;
    S.guesses = saved.guesses; S.cur = saved.cur || ""; S.done = saved.done; S.won = saved.won;
  } else {
    let pool = ANSWERS.filter(w => !seen.has(w));
    if (!pool.length) { seen = new Set(); store.set("lh.seen", []); pool = ANSWERS.slice(); toast("Pool complete \u2014 starting over", 2200); }
    S.answer = pool[Math.floor(Math.random() * pool.length)];
    S.rows = rowCount(); S.hard = settings.hard;
    S.guesses = []; S.cur = ""; S.done = false; S.won = false;
  }
  S.no = 0; S.cursor = Math.min(S.cur.replace(/\s+$/, "").length, LEN);
  mount(); save();
}

function mount() {
  document.documentElement.dataset.theme = settings.theme;
  document.querySelector('meta[name=theme-color]')
    .setAttribute("content", settings.theme === "dark" ? "#121116" : "#EBE9E3");
  document.getElementById("puzzle-no").textContent =
    S.mode === "daily" ? `No.\u00a0${S.no}` : `${ANSWERS.length - seen.size} left`;
  const bits = [];
  if (S.mode === "practice") bits.push("Practice");
  if (S.hard) bits.push("Hard");
  if (!S.hard && S.rows === 7) bits.push("Assist row");
  document.getElementById("modepill").textContent = bits.join(" \u00b7 ");
  buildBoard();
  S.guesses.forEach((g, r) => paintRow(r, g.split(""), mark(g, S.answer), false));
  if (!S.done) redrawCurrent();
  paintKeyboard();
  paintCursor();
}

/* ================================================================ sheets = */
const scrim = document.getElementById("scrim");
const sheet = document.getElementById("sheet");
function openSheet(html) {
  sheet.innerHTML = `<button class="icon close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` + html;
  scrim.classList.add("open");
  sheet.scrollTop = 0;
  sheet.tabIndex = -1;
  sheet.focus({ preventScroll: true });
  bindSheet();
}
function closeSheet() { scrim.classList.remove("open"); }
scrim.addEventListener("click", e => {
  if (e.target === scrim || e.target.closest("[data-close]")) closeSheet();
});

const tileHTML = (ch, cls) => `<div class="tile filled ${cls}">${ch}</div>`;
function helpSheet() {
  return `<h2>How to play</h2>
  <p class="sub">Find the seven-letter word. ${rowCount()} tries.</p>
  <p>Every guess must be a real seven-letter word. After each one, the tiles tell you how close you were.</p>
  <div class="ex">${tileHTML("c", "exact")}${tileHTML("l", "")}${tileHTML("i", "")}${tileHTML("m", "")}${tileHTML("a", "")}${tileHTML("t", "")}${tileHTML("e", "")}</div>
  <p><strong>C</strong> is in the word and in the right place.</p>
  <div class="ex">${tileHTML("h", "")}${tileHTML("a", "present")}${tileHTML("r", "")}${tileHTML("v", "")}${tileHTML("e", "")}${tileHTML("s", "")}${tileHTML("t", "")}</div>
  <p><strong>A</strong> is in the word, but somewhere else.</p>
  <div class="ex">${tileHTML("f", "")}${tileHTML("a", "")}${tileHTML("c", "")}${tileHTML("t", "")}${tileHTML("o", "")}${tileHTML("r", "absent")}${tileHTML("y", "")}</div>
  <p><strong>R</strong> is not in the word at all.</p>
  <h3>Repeated letters</h3>
  <p>A letter only lights up as many times as it actually appears. Guess <strong>BALLADS</strong> against <strong>BALLOON</strong> and the second A goes dark — there is only one A to find, and the first one claimed it.</p>
  <h3>What you will not be asked</h3>
  <p>No answer is ever a plain plural or a tense of a shorter word. <strong>BOTTLES</strong>, <strong>WALKING</strong> and <strong>TALLEST</strong> can be guessed but never hidden. Words like <strong>CEILING</strong>, <strong>TEACHER</strong> and <strong>SUCCESS</strong> stand on their own, so those are fair game.</p>
  <h3>Colour</h3>
  <p>Blue and amber rather than green and yellow, so the two states stay apart for colour-blind players by default.</p>
  <p style="color:var(--ink-faint);font-size:12.5px;margin-top:16px">One puzzle a day, ${ANSWERS.length.toLocaleString()} in the deck. Practice mode is unlimited. Nothing behind a paywall.</p>`;
}

function statsSheet() {
  const max = Math.max(1, ...stats.dist);
  const rows = stats.dist.map((n, i) => `<div class="bar"><i>${i + 1}</i><u class="${n === max && n > 0 ? "hi" : ""}" style="width:${8 + (n / max) * 78}%">${n}</u></div>`).join("");
  return `<h2>Statistics</h2><p class="sub">Daily puzzles only.</p>
  <div class="stats">
    <div class="stat"><b>${stats.played}</b><span>Played</span></div>
    <div class="stat"><b>${stats.played ? Math.round(100 * stats.won / stats.played) : 0}</b><span>Win %</span></div>
    <div class="stat"><b>${stats.streak}</b><span>Streak</span></div>
    <div class="stat"><b>${stats.max}</b><span>Best</span></div>
  </div>
  <h3>Guess distribution</h3><div class="bars">${rows}</div>`;
}

function shareText() {
  const sq = { 2: "\u{1F7E6}", 1: "\u{1F7E7}", 0: settings.theme === "dark" ? "\u2B1B" : "\u2B1C" };
  const grid = S.guesses.map(g => mark(g, S.answer).map(m => sq[m]).join("")).join("\n");
  const head = `Longhand No. ${S.no} \u2014 ${S.won ? S.guesses.length : "X"}/${S.rows}` +
    (S.hard ? " *" : "") + (stats.streak > 1 ? `  \u00b7  streak ${stats.streak}` : "");
  return head + "\n" + grid;
}

function resultSheet() {
  const share = S.mode === "daily";
  const grid = S.guesses.map(g =>
    `<div class="mini">` + mark(g, S.answer).map(m => `<i class="${NAMES[m]}"></i>`).join("") + `</div>`
  ).join("");
  const head = S.won
    ? ["Sharp.", "Neatly done.", "Written out in full.", "That will do nicely.", "Good hand."][Math.min(S.guesses.length - 1, 4)]
    : "Not this time";
  return `<h2>${head}</h2>
  <p class="sub">${S.won ? `Solved in ${S.guesses.length} of ${S.rows}` : "The word was"}</p>
  ${S.won ? "" : `<div class="answerline">${S.answer}</div>`}
  <div class="minigrid">${grid}</div>
  ${share ? `<button class="btn" id="do-share"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round"><path d="M12 16V4M8 8l4-4 4 4M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg>Share result</button>` : ""}
  <button class="btn ghost" id="do-practice">${share ? "Play a practice round" : "Another practice round"}</button>
  ${share ? `<p style="text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:12px">Next puzzle at midnight.</p>` : ""}`;
}

function settingsSheet() {
  const sw = (id, on) => `<button class="sw" role="switch" aria-checked="${on}" data-set="${id}" aria-label="${id}"></button>`;
  return `<h2>Settings</h2><p class="sub">Mode changes apply to the next puzzle you start.</p>
  <div class="seg" style="margin-bottom:6px">
    <button data-theme="dark" aria-pressed="${settings.theme === "dark"}">Dark</button>
    <button data-theme="light" aria-pressed="${settings.theme === "light"}">Light</button>
  </div>
  <div class="opt"><div>Hard mode<small>Five tries, and every revealed letter must be reused.</small></div>${sw("hard", settings.hard)}</div>
  <div class="opt"><div>Assist row<small>A seventh try. Off by default \u2014 six is the intended difficulty.</small></div>${sw("assist", settings.assist)}</div>
  <div class="opt"><div>Mark spent letters<small>Strike through a letter on the keyboard once you have found every one of them.</small></div>${sw("spent", settings.spent)}</div>
  <div class="opt"><div>Practice mode<small>${ANSWERS.length - seen.size} of ${ANSWERS.length} words unplayed.</small></div>
    <button class="icon" id="go-practice" aria-label="Start practice round"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9z"/></svg></button></div>
  <button class="btn ghost" id="reset-seen">Reset practice history</button>
  ${store.live ? "" : `<p style="font-size:12px;color:var(--ink-faint);margin-top:14px">Storage is unavailable here, so progress will not survive a reload.</p>`}`;
}

function bindSheet() {
  sheet.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => {
    settings.theme = b.dataset.theme; store.set("lh.settings", settings);
    document.documentElement.dataset.theme = settings.theme;
    document.querySelector('meta[name=theme-color]')
      .setAttribute("content", settings.theme === "dark" ? "#121116" : "#EBE9E3");
    openSheet(settingsSheet());
  });
  sheet.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    const k = b.dataset.set;
    settings[k] = !settings[k];
    store.set("lh.settings", settings);
    if (k === "spent") paintKeyboard();
    if ((k === "hard" || k === "assist") && S.guesses.length && !S.done)
      toast("Applies to your next puzzle", 1900);
    openSheet(settingsSheet());
  });
  const p = sheet.querySelector("#do-practice") || sheet.querySelector("#go-practice");
  if (p) p.onclick = () => { closeSheet(); startPractice(true); };
  const rs = sheet.querySelector("#reset-seen");
  if (rs) rs.onclick = () => { seen = new Set(); store.set("lh.seen", []); toast("Practice history cleared"); openSheet(settingsSheet()); };
  const sh = sheet.querySelector("#do-share");
  if (sh) sh.onclick = async () => {
    const text = shareText();
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); }
    } catch (e) { try { await navigator.clipboard.writeText(text); toast("Copied to clipboard"); } catch (_) { toast("Could not share"); } }
  };
}

document.getElementById("btn-help").onclick = () => openSheet(helpSheet());
document.getElementById("btn-stats").onclick = () => openSheet(statsSheet());
document.getElementById("btn-settings").onclick = () => openSheet(settingsSheet());

/* ================================================================= boot == */
if (new URLSearchParams(location.search).has("test")) runTests();
else {
  buildKeyboard();
  startDaily();
  document.getElementById("t-play").onclick = enterGame;
  document.getElementById("t-help").onclick = () => openSheet(helpSheet());
  // roll over to the new puzzle without a reload
  setInterval(() => { if (S.mode === "daily" && puzzleNumber() !== S.no) startDaily(); }, 30000);
}

/* ============================================================== self-test */
function runTests() {
  const out = [];
  let pass = 0, fail = 0;
  const M = { 2: "E", 1: "P", 0: "." };
  const show = m => m.map(x => M[x]).join("");
  const t = (name, got, want) => {
    const ok = got === want;
    ok ? pass++ : fail++;
    out.push(`<div class="${ok ? "p" : "f"}">${ok ? "PASS" : "FAIL"}  ${name}${ok ? "" : `   got ${got}  want ${want}`}</div>`);
  };

  // marking — the cases that break naive implementations
  t("BALLOON / BALLADS  surplus duplicate greys out", show(mark("ballads", "balloon")), "EEEE...");
  t("LETTERS / TESTERS  exact claims before present", show(mark("testers", "letters")), "PE.EEEE");
  t("ADDRESS / DRESSED  five duplicates, no exact", show(mark("dressed", "address")), "PPPPP.P");
  t("SUCCESS / SEASIDE  three-way duplicate pool", show(mark("seaside", "success")), "EP.P...");
  t("TATTOOS / STATUTE  interleaved duplicates", show(mark("statute", "tattoos")), "PPPE.P.");
  t("GRAMMAR / MARGATE  repeated A and R", show(mark("margate", "grammar")), "PPPPP..");
  t("REISSUE / SUNRISE  duplicate S and E", show(mark("sunrise", "reissue")), "PP.PPPE");
  t("identical guess is all exact", show(mark("balloon", "balloon")), "EEEEEEE");
  t("disjoint guess is all absent", show(mark("hymning", "cordate")), ".......");

  // knowledge / hard mode
  const k = knowledge(["ballads"], "balloon");
  t("knowledge fixes positions 1-4", k.fixed.map(x => x || "-").join(""), "ball---");
  t("knowledge closes A count at 1", String(k.exhausted.get("a")), "1");
  t("hard mode blocks a dropped exact", hardModeError("clarity", ["ballads"], "balloon"), "Position 1 must be B");
  t("hard mode blocks a dropped present", hardModeError("brought", ["clarity"], "balloon"), "Guess must use L");
  t("hard mode allows a legal guess", String(hardModeError("balloon", ["ballads"], "balloon")), "null");

  const k2 = knowledge(["ballads", "boulder"], "balloon");
  t("count closed for L at 2", String(k2.exhausted.get("l") ?? k2.minCount.get("l")), "2");

  // corpus integrity
  t("every answer is a valid guess", String(ANSWERS.every(w => VALID.has(w))), "true");
  t("every answer is seven letters", String(ANSWERS.every(w => w.length === 7)), "true");
  t("answers are lowercase a-z", String(ANSWERS.every(w => /^[a-z]{7}$/.test(w))), "true");
  t("no duplicate answers", String(new Set(ANSWERS).size === ANSWERS.length), "true");
  t("no plain plural of a shorter word in answers",
    String(!ANSWERS.some(w => ["bottles", "runners", "walking", "tallest", "happier", "cities", "stopped"].includes(w))), "true");
  t("common guesses accepted", String(["walking", "bottles", "tallest", "zymotic", "quinoas"].filter(w => VALID.has(w)).length >= 4), "true");

  // scheduling
  t("puzzle 1 is the epoch day", String(puzzleNumber(new Date(2026, 7, 12))), "1");
  t("puzzle number advances daily", String(puzzleNumber(new Date(2026, 7, 22))), "11");
  t("same date gives the same answer", answerFor(puzzleNumber(new Date(2026, 8, 1))), answerFor(21));
  t("schedule wraps safely", String(typeof answerFor(ANSWERS.length + 5)), "string");

  const div = document.createElement("div");
  div.id = "testpanel";
  div.innerHTML = `<div style="font-family:var(--f-display);font-size:20px;margin-bottom:14px">Longhand self-test</div>
    <div style="margin-bottom:14px">${pass} passed, ${fail} failed &nbsp;\u00b7&nbsp; ${ANSWERS.length} answers, ${VALID.size} valid guesses</div>
    ${out.join("")}`;
  document.body.appendChild(div);
}
</script>
</body>
</html>
